<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decent Sampler UI-Editor</title>
<style>
:root{
  --bg:#12141a;--panel:#1b1f27;--panel2:#232833;--panel3:#2b3140;--line:#3a4254;
  --text:#f1f4f9;--muted:#b0b9ca;--accent:#ffb454;--accent2:#4fd1c5;--danger:#ff7b7b;--ok:#7bd88f;
  --fs:15px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:3px solid var(--accent2);outline-offset:1px}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
header.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px;color:var(--accent);letter-spacing:.3px;margin-right:6px}
.brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
header .spacer{flex:1}
input[type=text],input[type=number],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:34px;width:100%}
textarea{min-height:70px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
input[type=number]{width:92px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent2)}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=color]{width:42px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
#projName{width:240px;font-weight:600}
.btn{background:var(--panel3);border:1px solid var(--line);border-radius:6px;padding:6px 12px;min-height:34px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{border-color:#7a3b3b;color:var(--danger)}
.btn.small{min-height:28px;padding:2px 8px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
nav.tabs{display:flex;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
main{min-height:0;position:relative}
.view{display:none;height:100%;min-height:0}
.view.active{display:block}
#view-design.active{display:grid;grid-template-columns:290px minmax(0,1fr) 370px}
.side{background:var(--panel);overflow:auto;padding:12px;min-height:0}
.side.left{border-right:1px solid var(--line)}
.side.right{border-left:1px solid var(--line)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 8px}
h2:first-child{margin-top:0}
h3{font-size:16px;margin:0 0 8px}
label.lbl{display:block;color:var(--muted);font-size:13px;margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
ul.layers{list-style:none;margin:0;padding:0}
ul.layers li{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid transparent;border-radius:6px;cursor:pointer}
ul.layers li:hover{background:var(--panel2)}
ul.layers li.sel{background:var(--panel3);border-color:var(--accent2)}
ul.layers li .ic{width:22px;text-align:center;color:var(--accent)}
ul.layers li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.center{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0;background:#0c0e12}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.toolbar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.toolbar select{width:auto}
.stage{overflow:auto;padding:24px;min-height:0}
.canvas-wrap{position:relative;margin:0 auto}
.ui-canvas{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 0 0 1px #000,0 8px 30px #000a;overflow:hidden;
  background-color:#222;background-image:linear-gradient(45deg,#2c2c2c 25%,transparent 25%,transparent 75%,#2c2c2c 75%),linear-gradient(45deg,#2c2c2c 25%,transparent 25%,transparent 75%,#2c2c2c 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.ui-bg{position:absolute;inset:0;pointer-events:none}
.ui-grid{position:absolute;inset:0;pointer-events:none;opacity:.22}
.ui-el{position:absolute;cursor:move;user-select:none;touch-action:none}
.ui-el.hidden-el{opacity:.35}
.ui-el.sel{outline:2px solid var(--accent2);outline-offset:1px;z-index:99999}
.ui-el .handle{position:absolute;right:-7px;bottom:-7px;width:12px;height:12px;background:var(--accent2);border:1px solid #000;cursor:nwse-resize;border-radius:2px}
.kbd-wrap{padding:8px 12px 14px;background:var(--panel);border-top:1px solid var(--line);overflow:auto}
.kbd-wrap .cap{font-size:12px;color:var(--muted);margin-bottom:4px}
.piano{position:relative;height:64px;margin:0 auto;background:#000}
.piano .wk{position:absolute;top:0;height:64px;background:#f5f5f5;border:1px solid #333}
.piano .bk{position:absolute;top:0;height:40px;background:#111;border:1px solid #000;z-index:2}
.piano .cv{position:absolute;inset:0;pointer-events:none;opacity:.75}
fieldset{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:6px 10px 10px}
details.sec{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--panel2)}
details.sec>summary{cursor:pointer;padding:8px 10px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
details.sec>summary::before{content:"▸";color:var(--accent)}
details.sec[open]>summary::before{content:"▾"}
details.sec>.body{padding:2px 10px 10px}
.fld{margin:7px 0}
.fld>label{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.fld .help{font-size:12px;color:#8e98ab;margin-top:2px}
.fld .num{display:flex;gap:8px;align-items:center}
.fld .num input[type=number]{flex:0 0 96px}
.fld .col{display:flex;gap:6px;align-items:center}
.fld .col input[type=text]{width:88px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.fld .col input[type=range]{width:70px}
.fld .asset{display:flex;gap:6px}
.fld.bool{display:flex;align-items:center;gap:8px}
.fld.bool label{margin:0;color:var(--text);font-size:14px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
.card.sub{background:var(--panel);margin:8px 0}
.card .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.card .hd .t{font-weight:700;flex:1}
.bind{border:1px dashed var(--line);border-radius:8px;padding:8px;margin:8px 0;background:var(--panel)}
.bind .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.badge{display:inline-block;background:var(--panel3);border-radius:10px;padding:0 8px;font-size:12px;color:var(--muted)}
.view-pad{height:100%;overflow:auto;padding:18px 22px}
.view-pad .inner{max-width:1100px;margin:0 auto}
.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;height:100%}
.split>.list{overflow:auto;padding:12px;background:var(--panel);border-right:1px solid var(--line)}
.split>.edit{overflow:auto;padding:16px 20px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
.tbl th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
.tbl input,.tbl select{min-height:30px;padding:3px 6px}
.tbl input[type=number]{width:70px}
.thumb{width:44px;height:44px;object-fit:contain;background:repeating-conic-gradient(#333 0 25%,#222 0 50%) 0 0/12px 12px;border-radius:4px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--text);background:#ffb45418}
.warn{background:#3a2e10;border:1px solid #7a5d1a;border-radius:8px;padding:8px 12px;margin:6px 0}
.warn.err{background:#3a1717;border-color:#7a3030}
.warn.ok{background:#132a1a;border-color:#2f6b42}
pre.xml{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:420px;overflow:auto;font-size:12.5px;white-space:pre;tab-size:2}
.note{font-size:13px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9999;align-items:center}
#toast div{background:#000d;border:1px solid var(--accent2);padding:9px 16px;border-radius:10px;box-shadow:0 4px 20px #000a;max-width:80vw}
#toast div.err{border-color:var(--danger)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:520px;width:92vw}
dialog::backdrop{background:#000a}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--panel3);border-radius:20px;padding:2px 10px;font-size:13px}
.hr{height:1px;background:var(--line);margin:12px 0}
@media (max-width:1250px){#view-design.active{grid-template-columns:230px minmax(0,1fr) 320px}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s}}
</style>
</head>
<body>
<div id="app">
<header class="top">
  <div class="brand">DS UI-Editor<small>for Decent Sampler</small></div>
  <label for="projName" class="note" style="margin:0">Project</label>
  <input type="text" id="projName" aria-label="Project name">
  <span class="spacer"></span>
  <button class="btn" id="btnNew">New…</button>
  <button class="btn" id="btnOpen">Open project</button>
  <button class="btn" id="btnSave">Save project</button>
  <button class="btn" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
  <button class="btn" id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
  <button class="btn primary" id="btnGoExport">Export</button>
</header>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-view="design" aria-selected="true">1 · Design</button>
  <button role="tab" data-view="sound" aria-selected="false">2 · Sound &amp; Samples</button>
  <button role="tab" data-view="fx" aria-selected="false">3 · Effects</button>
  <button role="tab" data-view="mod" aria-selected="false">4 · Modulators</button>
  <button role="tab" data-view="more" aria-selected="false">5 · MIDI &amp; More</button>
  <button role="tab" data-view="files" aria-selected="false">6 · Files &amp; Folders</button>
  <button role="tab" data-view="export" aria-selected="false">7 · Export</button>
</nav>
<main>
  <section class="view active" id="view-design">
    <aside class="side left" aria-label="Elements">
      <h2>Add element</h2>
      <label class="lbl" for="selCat">Category</label>
      <select id="selCat"></select>
      <label class="lbl" for="selType">Element</label>
      <select id="selType"></select>
      <div class="row" style="margin-top:10px"><button class="btn primary grow" id="btnAdd">+ Add</button></div>
      <div class="note" id="typeHelp" style="margin-top:6px"></div>
      <h2>Quick add</h2>
      <div class="quick" id="quick"></div>
      <h2>Layers <span class="badge" id="layerCount">0</span></h2>
      <p class="note" style="margin:0 0 6px">Order = order in the .dspreset (top = drawn first).</p>
      <ul class="layers" id="layers"></ul>
    </aside>
    <div class="center">
      <div class="toolbar">
        <label>Zoom <select id="zoomSel"><option value="0.5">50 %</option><option value="0.75">75 %</option><option value="1" selected>100 %</option><option value="1.25">125 %</option><option value="1.5">150 %</option><option value="2">200 %</option></select></label>
        <label><input type="checkbox" id="gridShow"> Show grid</label>
        <label><input type="checkbox" id="gridSnap" checked> Snap</label>
        <label>Grid size <input type="number" id="gridSize" value="5" min="1" max="100" style="width:70px"></label>
        <button class="btn small" id="btnSelUI">Interface (size, background)</button>
        <span class="note" id="posInfo"></span>
      </div>
      <div class="stage" id="stage"><div class="canvas-wrap" id="canvasWrap"><div class="ui-canvas" id="canvas"></div></div></div>
      <div class="kbd-wrap" id="kbdWrap"><div class="cap">Preview of the on-screen keyboard (shown below the interface)</div><div class="piano" id="piano"></div></div>
    </div>
    <aside class="side right" id="props" aria-label="Properties"></aside>
  </section>
  <section class="view" id="view-sound"></section>
  <section class="view" id="view-fx"></section>
  <section class="view" id="view-mod"></section>
  <section class="view" id="view-more"></section>
  <section class="view" id="view-files"></section>
  <section class="view" id="view-export"></section>
</main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" multiple hidden>
<input type="file" id="projIn" accept=".json,.dsui.json,application/json" hidden>
<dialog id="dlgNew">
  <h3>New project</h3>
  <p class="note">The current project will be replaced.</p>
  <label class="lbl" for="tplSel">Template</label>
  <select id="tplSel">
    <option value="empty">Empty – interface 812 × 375 only</option>
    <option value="basic">Simple – 5 knobs (Attack, Release, Chorus, Tone, Reverb)</option>
  </select>
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="dlgNewCancel">Cancel</button><button class="btn primary" id="dlgNewOk">Create</button></div>
</dialog>
<script>
'use strict';
/* ===================== Kern: Hilfsfunktionen, Zustand, Verlauf, Dateien ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,a,...kids){
  const e=document.createElement(tag);
  for(const k in (a||{})){
    const v=a[k]; if(v===undefined||v===null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='selected'||k==='readOnly')e[k]=v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false)continue; e.append(c&&c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
let _uid=0;
const uid=()=>'i'+(++_uid).toString(36)+Math.random().toString(36).slice(2,6);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isNum=v=>v!==''&&v!==null&&v!==undefined&&!isNaN(Number(v));
function toast(msg,err){const d=h('div',{class:err?'err':''},msg);$('#toast').append(d);setTimeout(()=>d.remove(),err?6000:3200);}
function download(name,blob){const a=h('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}

/* ---- Farben (ARGB, 8-stellig, ohne #) ---- */
function normARGB(v){
  if(v==null)return''; v=String(v).trim().replace(/^#/,'').toUpperCase();
  if(/^[0-9A-F]{6}$/.test(v))return'FF'+v; if(/^[0-9A-F]{8}$/.test(v))return v; return'';
}
function cssColor(v,def){
  v=normARGB(v||def||''); if(!v)return'transparent';
  const a=parseInt(v.slice(0,2),16)/255,r=parseInt(v.slice(2,4),16),g=parseInt(v.slice(4,6),16),b=parseInt(v.slice(6,8),16);
  return`rgba(${r},${g},${b},${a.toFixed(3)})`;
}
function rgbHex(v){v=normARGB(v);return v?'#'+v.slice(2).toLowerCase():'#000000';}
function alphaOf(v){v=normARGB(v);return v?parseInt(v.slice(0,2),16):255;}

/* ---- Zustand ---- */
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteLabel(n){n=Number(n);return NOTE_NAMES[((n%12)+12)%12]+(Math.floor(n/12)-2);}  /* C3 = 60 (wie Decent Sampler) */
function newGroup(name){return{id:uid(),p:{name:name||'Group 1'},osc:{on:false,p:{waveform:'sine'}},samples:[],fx:[]};}
function newProject(){
  return{v:2,name:'My Instrument',
    paths:{images:'Images',samples:'Samples',other:'Samples'},
    ui:{width:812,height:375,bgColor:'FF2A2F3A',bgImage:'',coverArt:'',tabName:'main'},
    grid:{show:false,snap:true,size:5,zoom:1},
    elements:[],keyboard:{on:false,centerNote:'',colors:[]},
    groupsP:{attack:0.001,decay:25,sustain:1,release:0.4},
    groups:[newGroup('Group 1')],effects:[],buses:[],tags:[],modulators:[],
    midi:{ccs:[],notes:[],velocity:{on:false,p:{},b:[]}},
    arp:{on:false,p:{}},minVersion:'1.0.0',customXml:''};
}
let S=newProject();
let ASSETS={};          /* name -> {name,kind,mime,size,blob,dataURL,w,h,family} */
let SEL=null;           /* ausgewählte Element-ID, 'ui' oder null */
let VIEW='design';

/* ---- Verlauf (Rückgängig/Wiederholen) und Autosave ---- */
const HIST={undo:[],redo:[],last:null};
function commit(){
  const s=JSON.stringify(S);
  if(s===HIST.last)return;
  if(HIST.last!==null){HIST.undo.push(HIST.last);if(HIST.undo.length>80)HIST.undo.shift();HIST.redo.length=0;}
  HIST.last=s; scheduleSave(); updateUndo();
}
function resetHistory(){HIST.undo=[];HIST.redo=[];HIST.last=JSON.stringify(S);updateUndo();}
function updateUndo(){const u=$('#btnUndo'),r=$('#btnRedo');if(u)u.disabled=!HIST.undo.length;if(r)r.disabled=!HIST.redo.length;}
function undo(){if(!HIST.undo.length)return;HIST.redo.push(HIST.last);HIST.last=HIST.undo.pop();S=JSON.parse(HIST.last);afterReplace();scheduleSave();}
function redo(){if(!HIST.redo.length)return;HIST.undo.push(HIST.last);HIST.last=HIST.redo.pop();S=JSON.parse(HIST.last);afterReplace();scheduleSave();}
function afterReplace(){
  if(SEL&&SEL!=='ui'&&!S.elements.find(e=>e.id===SEL))SEL=null;
  updateUndo();renderAll();
}
let _saveT=null;
function scheduleSave(){clearTimeout(_saveT);_saveT=setTimeout(autosave,900);}
function projectJSON(withAudioMeta){
  const assets=Object.values(ASSETS).map(a=>({name:a.name,kind:a.kind,mime:a.mime,size:a.size,w:a.w,h:a.h,family:a.family,dataURL:(a.kind==='image'||a.kind==='font')?a.dataURL:undefined}));
  return{app:'ds-ui-editor',version:2,project:S,assets};
}
function autosave(){
  try{localStorage.setItem('dsui_autosave',JSON.stringify(projectJSON()));$('#projName').title='Automatically saved';}
  catch(e){try{const j=projectJSON();j.assets.forEach(a=>delete a.dataURL);localStorage.setItem('dsui_autosave',JSON.stringify(j));}catch(e2){}}
}

/* ---- Dateien (Assets) ---- */
const EXT_KIND={png:'image',jpg:'image',jpeg:'image',gif:'image',webp:'image',svg:'image',
  wav:'audio',aif:'audio',aiff:'audio',flac:'audio',rx2:'audio',rex:'audio',rcy:'audio',mp3:'audio',ogg:'audio',
  ttf:'font',otf:'font',woff:'font',woff2:'font'};
const KIND_LABEL={image:'Graphic',audio:'Sample / audio',font:'Font (editor only)',other:'Other (IR, wavetable)'};
function kindOf(n){const m=/\.([a-z0-9]+)$/i.exec(n);return(m&&EXT_KIND[m[1].toLowerCase()])||'other';}
function uniqueName(n){
  if(!ASSETS[n])return n;
  const m=/^(.*?)(\.[^.]*)?$/.exec(n);let i=2;while(ASSETS[`${m[1]}_${i}${m[2]||''}`])i++;return`${m[1]}_${i}${m[2]||''}`;
}
const readDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
const imgSize=url=>new Promise(res=>{const i=new Image();i.onload=()=>res([i.naturalWidth,i.naturalHeight]);i.onerror=()=>res([0,0]);i.src=url;});
async function registerFont(a){
  try{a.family='DSF '+a.name.replace(/\.[^.]+$/,'');const ff=new FontFace(a.family,`url(${a.dataURL})`);await ff.load();document.fonts.add(ff);}catch(e){toast('Font could not be loaded: '+a.name,true);}
}
async function addAssetFiles(files,forceKind){
  const added=[];
  for(const f of files){
    const kind=forceKind||kindOf(f.name); const nm0=f.name.replace(/[\\/:*?"<>|]/g,'_'); const name=(ASSETS[nm0]&&ASSETS[nm0].missing)?nm0:uniqueName(nm0);
    const a={name,kind,mime:f.type,size:f.size,blob:f};
    if(kind==='image'||kind==='font'){a.dataURL=await readDataURL(f);}
    if(kind==='image'){[a.w,a.h]=await imgSize(a.dataURL);}
    if(kind==='font')await registerFont(a);
    ASSETS[name]=a;added.push(a);
  }
  scheduleSave();return added;
}
function assetsOf(kind){return Object.values(ASSETS).filter(a=>a.kind===kind);}
function folderFor(kind){return(kind==='image'?S.paths.images:kind==='audio'?S.paths.samples:S.paths.other)||'';}
function joinPath(f,n){f=String(f||'').replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');return f?f+'/'+n:n;}
/* Pfad eines Feldwerts (Dateiname aus der Dateiliste oder eigener Pfad) -> Pfad in der .dspreset */
function resolveAssetPath(kind,val,warns){
  if(!val)return'';
  if(ASSETS[val])return joinPath(folderFor(ASSETS[val].kind),val);
  if(/[\\/]/.test(val))return val.replace(/\\/g,'/');
  if(warns)warns.push(`File “${val}” is not in the file list – path was entered anyway.`);
  return joinPath(folderFor(kind),val);
}
function assetURL(name){const a=ASSETS[name];return a&&a.dataURL?a.dataURL:null;}
function pickFiles(accept,multiple){

    i.onchange=()=>res([...i.files]);i.click();});
}
/* Notenname/Zahl im Dateinamen erkennen: C-2, C#3, 60 ... (C3 = 60) */
function parseNoteFromName(n,octOffset){
  n=n.replace(/\.[^.]+$/,'');
  const m=[...n.matchAll(/(?:^|[^A-Za-z#])([A-Ga-g])([#b]?)(-?\d)(?![0-9])/g)].pop();
  if(m){
    const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()];
    let semi=base+(m[2]==='#'?1:m[2]==='b'?-1:0);
    return(Number(m[3])+2+(octOffset||0))*12+semi;
  }
  const d=[...n.matchAll(/(?:^|[^0-9])(\d{1,3})(?![0-9])/g)].pop();
  if(d&&Number(d[1])<=127)return Number(d[1]);
  return null;
}

function fontOptions(){

function maxFor(f){return f.max==='W'?S.ui.width:f.max==='H'?S.ui.height:f.max;}
function renderForm(fields,obj,opt){
  opt=opt||{};const on=opt.on||((live)=>{if(!live)commit();});
  const root=h('div');const secs=[];let cur=null;
  const visible=fields.filter(f=>!f.when||f.when(obj));
  visible.forEach(f=>{const sec=f.sec||'';if(!cur||cur.name!==sec){cur={name:sec,fields:[]};secs.push(cur);}cur.fields.push(f);});
  secs.forEach((s,i)=>{
    const body=h('div',{class:'body'});
    s.fields.forEach(f=>body.append(fieldRow(f,obj,on,opt)));
    if(!s.name){root.append(body);return;}
    const d=h('details',{class:'sec'},h('summary',{},s.name),body);
    const key=(opt.key||'f')+':'+s.name;
    d.open=opt.openAll||(OPEN_SECS.has(key)?OPEN_SECS.get(key):i===0);
    d.addEventListener('toggle',()=>OPEN_SECS.set(key,d.open));
    root.append(d);
  });
  return root;
}
const OPEN_SECS=new Map();
function fieldRow(f,obj,on,opt){
  const id='fld'+uid();const reb=()=>{if(f.rebuild&&opt.rebuild)opt.rebuild();};
  const getv=()=>obj[f.k];
  const setv=(v)=>{if(v===''||v===undefined)delete obj[f.k];else obj[f.k]=v;};
  const wrap=h('div',{class:'fld'+(f.t==='bool'?' bool':'')});
  const help=f.h?h('div',{class:'help'},f.h):null;
  if(f.t==='bool'){
    const cb=h('input',{type:'checkbox',id,checked:getv()===undefined?!!f.d:!!getv()});
    cb.addEventListener('change',()=>{obj[f.k]=cb.checked;on(false,f);reb();});
    wrap.append(cb,h('label',{for:id},f.l));if(help)wrap.append(help);return wrap;
  }
  wrap.append(h('label',{for:id},f.l));
  if(f.t==='num'||f.t==='int'){
    const mx=maxFor(f);
    const inp=h('input',{type:'number',id,step:f.step||(f.t==='int'?1:'any'),min:f.min,max:f.slider?undefined:mx,placeholder:f.d!==undefined?String(f.d):'',value:getv()===undefined?'':getv()});
    const parse=()=>{const v=inp.value;if(v==='')return'';let n=Number(v);if(isNaN(n))return'';return f.t==='int'?Math.round(n):n;};
    let rng=null;
    const row=h('div',{class:'num'},inp);
    if(f.slider){
      const base=isNum(getv())?Number(getv()):(f.d!==undefined?Number(f.d):0);
      rng=h('input',{type:'range',min:f.min!==undefined?f.min:0,max:mx,step:f.step||1,value:base,'aria-label':f.l+' (slider)'});
      rng.addEventListener('input',()=>{const n=Number(rng.value);inp.value=n;setv(n);on(true,f);});
      rng.addEventListener('change',()=>{on(false,f);});
      row.append(rng);
    }
    inp.addEventListener('input',()=>{const v=parse();setv(v);if(rng&&v!=='')rng.value=v;on(true,f);});
    inp.addEventListener('change',()=>{on(false,f);reb();});
    wrap.append(row);
  }else if(f.t==='txt'){
    const inp=h('input',{type:'text',id,value:getv()===undefined?'':getv(),placeholder:f.d!==undefined?String(f.d):''});
    inp.addEventListener('input',()=>{setv(inp.value);on(true,f);});inp.addEventListener('change',()=>{on(false,f);reb();});wrap.append(inp);
  }else if(f.t==='area'){
    const inp=h('textarea',{id,placeholder:f.extra?'attributeName="value" …':''});inp.value=getv()===undefined?'':getv();
    inp.addEventListener('input',()=>{setv(inp.value);on(true,f);});inp.addEventListener('change',()=>on(false,f));wrap.append(inp);
  }else if(f.t==='sel'||f.t==='font'){
    const opts=f.t==='font'?fontOptions():f.opts.map(o=>Array.isArray(o)?o:[o,o]);
    const s=h('select',{id},opts.map(o=>h('option',{value:o[0]},o[1])));
    let cv=getv();if(cv===undefined)cv=f.d!==undefined?f.d:'';
    if(!opts.some(o=>o[0]===cv))s.append(h('option',{value:cv},cv+' (not available)'));
    s.value=cv;
    s.addEventListener('change',()=>{setv(s.value);on(false,f);reb();});wrap.append(s);
  }else if(f.t==='col'){
    const val=normARGB(getv()===undefined?'':getv());const shown=val||normARGB(f.d||'');
    const cp=h('input',{type:'color',id,value:rgbHex(shown),'aria-label':f.l+' Color'});
    const al=h('input',{type:'range',min:0,max:255,value:shown?alphaOf(shown):255,title:'Opacity','aria-label':f.l+' Opacity'});
    const hex=h('input',{type:'text',value:val,placeholder:shown||'AARRGGBB',maxlength:9,'aria-label':f.l+' Hex value'});
    const clr=h('button',{class:'btn small',type:'button',title:'Reset (default)'},'✕');
    const apply=(live)=>{const v=(alphaOf('FF'+cp.value.slice(1))&&0,((+al.value)|0x100).toString(16).slice(1)+cp.value.slice(1)).toUpperCase();obj[f.k]=v;hex.value=v;on(live,f);};
    cp.addEventListener('input',()=>apply(true));cp.addEventListener('change',()=>apply(false));
    al.addEventListener('input',()=>apply(true));al.addEventListener('change',()=>apply(false));
    hex.addEventListener('change',()=>{const v=normARGB(hex.value);if(v){obj[f.k]=v;cp.value=rgbHex(v);al.value=alphaOf(v);}else if(hex.value===''){delete obj[f.k];}on(false,f);});
    clr.addEventListener('click',()=>{delete obj[f.k];hex.value='';const d=normARGB(f.d||'');if(d){cp.value=rgbHex(d);al.value=alphaOf(d);}on(false,f);});
    wrap.append(h('div',{class:'col'},cp,al,hex,clr));
  }else if(f.t==='img'||f.t==='aud'||f.t==='fil'){
    const kind=f.t==='img'?'image':f.t==='aud'?'audio':'other';
    const list=f.t==='fil'?Object.values(ASSETS).filter(a=>a.kind==='other'||a.kind==='audio'):assetsOf(kind);
    const s=h('select',{id},h('option',{value:''},'(none)'),list.map(a=>h('option',{value:a.name},a.name)));
    const cv=getv()||'';if(cv&&!ASSETS[cv])s.append(h('option',{value:cv},cv+(/[\\/]/.test(cv)?' (custom path)':' (not loaded)')));
    s.value=cv;
    s.addEventListener('change',()=>{setv(s.value);on(false,f);reb();});
    const add=h('button',{class:'btn small',type:'button',title:'Add file'},'＋');
    add.addEventListener('click',async()=>{
      const acc=kind==='image'?'image/*':kind==='audio'?'audio/*,.wav,.aif,.aiff,.flac,.rx2':'';
      const fl=await pickFiles(acc,false);if(!fl.length)return;
      const a=(await addAssetFiles(fl,f.t==='fil'?undefined:kind))[0];if(!a)return;setv(a.name);on(false,f);if(opt.rebuild)opt.rebuild();else renderAll();
    });
    const pen=h('button',{class:'btn small',type:'button',title:'Enter custom path'},'✎');
    pen.addEventListener('click',()=>{const v=prompt('Path relative to the .dspreset (e.g. Images/knob.png):',cv);if(v===null)return;setv(v.trim());on(false,f);if(opt.rebuild)opt.rebuild();});
    wrap.append(h('div',{class:'asset'},s,add,pen));
  }
  if(help)wrap.append(help);
  return wrap;
}

function targetOptions(tk){

  else if(tk==='effect'){

    S.groups.forEach((g,gi)=>g.fx.forEach((e,j)=>o.push(['g:'+g.id+':'+e.id,'Group “'+gname(g,gi)+'“ › '+j+': '+fxLabel(e)])));
    S.buses.forEach((b,bi)=>b.fx.forEach((e,j)=>o.push(['b:'+b.id+':'+e.id,'Bus '+bi+' › '+j+': '+fxLabel(e)])));
    o.push(['__tags','(via effect tag)']);
  }
  else if(tk==='control')S.elements.forEach((e,i)=>o.push([e.id,i+': '+ELT[e.t].name+(labelOfEl(e)?' „'+labelOfEl(e)+'“':'')]));
  else if(tk==='modulator'){S.modulators.forEach((m,i)=>o.push([m.id,i+': '+MODS[m.t].name]));o.push(['__tags','(via modulator tag)']);}

/* ---- Maus-Interaktion auf der Fläche ---- */
function canvasPoint(ev){const r=$('#canvas').getBoundingClientRect(),z=S.grid.zoom||1;return[(ev.clientX-r.left)/z,(ev.clientY-r.top)/z];}
function initCanvas(){
  const cv=$('#canvas');
  cv.addEventListener('pointerdown',ev=>{
    if(ev.button!==0)return;
    const d=ev.target.closest('.ui-el');
    if(!d){if(SEL!=='ui'){SEL='ui';renderDesignSel();}return;}
    const el=S.elements.find(e=>e.id===d.dataset.id);if(!el)return;
    const resize=!!ev.target.closest('.handle');
    if(SEL!==el.id){SEL=el.id;renderDesignSel();}
    ev.preventDefault();
    const div=$(`.ui-el[data-id="${el.id}"]`);
    const [sx,sy]=canvasPoint(ev);const p0=Object.assign({},el.p);const b0=elBox(el);let moved=false;
    const g=Math.max(1,+S.grid.size||5);
    const sn=(v,e)=>(S.grid.snap&&!e.altKey)?Math.round(v/g)*g:Math.round(v);
    div.setPointerCapture(ev.pointerId);
    const mv=e=>{
      const[x,y]=canvasPoint(e);let dx=x-sx,dy=y-sy;
      if(!moved&&Math.abs(dx)+Math.abs(dy)<2)return;moved=true;
      if(el.t==='line'){
        if(resize){el.p.x2=sn((+p0.x2||0)+dx,e);el.p.y2=sn((+p0.y2||0)+dy,e);}
        else{const nx=sn(b0.x+dx,e)-b0.x,ny=sn(b0.y+dy,e)-b0.y;el.p.x1=(+p0.x1||0)+nx;el.p.x2=(+p0.x2||0)+nx;el.p.y1=(+p0.y1||0)+ny;el.p.y2=(+p0.y2||0)+ny;}
      }else if(resize){el.p.width=Math.max(4,sn(b0.w+dx,e));el.p.height=Math.max(4,sn(b0.h+dy,e));}
      else{el.p.x=sn(b0.x+dx,e);el.p.y=sn(b0.y+dy,e);}
      fillEl(div,el);const bb=elBox(el);$('#posInfo').textContent=`X ${bb.x}  Y ${bb.y}  ·  ${bb.w} × ${bb.h}`;
    };
    const up=()=>{div.removeEventListener('pointermove',mv);div.removeEventListener('pointerup',up);div.removeEventListener('pointercancel',up);
      if(moved){commit();renderProps();}};
    div.addEventListener('pointermove',mv);div.addEventListener('pointerup',up);div.addEventListener('pointercancel',up);
  });
}
/* ---- Piano-Vorschau ---- */
function renderPiano(){
  const wrapEl=$('#kbdWrap'),pi=$('#piano');
  wrapEl.style.display=S.keyboard.on?'':'none';
  if(!S.keyboard.on)return;
  const lo=36,hi=96,W=(+S.ui.width||812)*(S.grid.zoom||1);
  const isBlack=n=>[1,3,6,8,10].includes(n%12);
  let whites=0;for(let n=lo;n<=hi;n++)if(!isBlack(n))whites++;
  const kw=W/whites;pi.style.width=W+'px';pi.replaceChildren();
  const xOf={};let wi=0;
  for(let n=lo;n<=hi;n++){
    if(!isBlack(n)){xOf[n]=wi*kw;pi.append(h('div',{class:'wk',style:{left:(wi*kw)+'px',width:kw+'px'}}));wi++;}
    else{xOf[n]=wi*kw-kw*0.3;}
  }
  for(let n=lo;n<=hi;n++)if(isBlack(n))pi.append(h('div',{class:'bk',style:{left:xOf[n]+'px',width:(kw*0.6)+'px'}}));
  S.keyboard.colors.forEach(c=>{
    const a=clamp(+c.p.loNote||0,lo,hi),b=clamp(+c.p.hiNote||0,lo,hi);if(b<a)return;
    const x0=xOf[a]-(isBlack(a)?0:0),x1=xOf[b]+(isBlack(b)?kw*0.6:kw);
    pi.append(h('div',{style:{position:'absolute',left:x0+'px',width:Math.max(2,x1-x0)+'px',top:0,height:'100%',background:cssColor(c.p.color,'FF6D9DC5'),opacity:.55,pointerEvents:'none',zIndex:3}}));
  });
  const cn=parseInt(S.keyboard.centerNote);
  if(!isNaN(cn)&&xOf[cn]!==undefined)pi.append(h('div',{style:{position:'absolute',left:xOf[cn]+'px',bottom:'2px',width:kw+'px',textAlign:'center',fontSize:'10px',color:'#000',zIndex:4}},'◆'));
}

let SOUNDSEL=null,OCT=0;
function autoMap(g){
  const ss=g.samples.filter(s=>isNum(s.p.rootNote));
  const roots=[...new Set(ss.map(s=>+s.p.rootNote))].sort((a,b)=>a-b);
  roots.forEach((r,i)=>{
    const lo=i===0?0:Math.floor((roots[i-1]+r)/2)+1,hi=i===roots.length-1?127:Math.floor((r+roots[i+1])/2);
    ss.filter(s=>+s.p.rootNote===r).forEach(s=>{s.p.loNote=lo;s.p.hiNote=hi;});
  });
}
function samplesFromAssets(g,as){
  let miss=0;
  as.forEach(a=>{const n=parseNoteFromName(a.name,OCT);if(n===null)miss++;g.samples.push({id:uid(),p:{path:a.name,rootNote:n===null?60:n}});});
  autoMap(g);return miss;
}
function targetGroup(){return S.groups.find(g=>g.id===SOUNDSEL)||S.groups[0]||(S.groups.push(newGroup('Group 1')),S.groups[0]);}
/* Audiodateien, die noch in keiner Gruppe als Sample stehen, automatisch der aktuellen Gruppe zuordnen */
function adoptAudio(as){
  const used=new Set();S.groups.forEach(g=>g.samples.forEach(s=>used.add(s.p.path)));
  const fresh=as.filter(a=>a.kind==='audio'&&!used.has(a.name));
  if(!fresh.length)return 0;
  const g=targetGroup();fresh.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const miss=samplesFromAssets(g,fresh);
  toast(fresh.length+' audio file(s) added as samples in “'+(g.p.name||'Group')+'” entered (tab 2).'+(miss?' For '+miss+' file(s), the pitch was not detected – root note set to 60, please check.':''),!!miss);
  return fresh.length;
}
async function addSamples(g,files){
  files=[...files].filter(f=>kindOf(f.name)==='audio');
  if(!files.length){toast('No audio files detected (allowed: wav, aif, aiff, flac, mp3, ogg).',true);return;}
  files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const as=await addAssetFiles(files,'audio');
  const miss=samplesFromAssets(g,as);
  commit();rerender();
  toast(as.length+' sample(s) added'+(miss?' – at '+miss+' the pitch could not be detected from the file name (root note set to 60).':'.'),!!miss);
}

async function loadProject(obj,keepHistory){

  n.keyboard=Object.assign({},base.keyboard,P.keyboard);n.midi=Object.assign({},base.midi,P.midi);n.arp=Object.assign({},base.arp,P.arp);
  ['elements','groups','effects','buses','tags','modulators'].forEach(k=>{if(!Array.isArray(n[k]))n[k]=base[k];});
  n.groups.forEach(g=>{g.fx=g.fx||[];g.samples=g.samples||[];g.osc=g.osc||{on:false,p:{waveform:'sine'}};});

/* ===================== Export: XML, Label-Bilder, ZIP ===================== */
const ind=n=>'  '.repeat(n);
const fmtN=v=>String(+(+v).toFixed(6));
function xmlOk(str){const d=new DOMParser().parseFromString(str,'application/xml');const e=d.querySelector('parsererror');return e?e.textContent.split('\n')[0]:null;}
function extraAttrs(str,W,label){
  str=String(str||'').trim();if(!str)return'';
  const err=xmlOk('<x '+str+'/>');
  if(err){W.push({t:'Additional attributes for “'+label+'” are invalid and were omitted: '+str,err:true});return'';}
  return' '+str;
}
function A(fields,p,W,label,skipKeys){
  let out='';const seen=new Set(skipKeys||[]);
  for(const f of fields){
    if(f.ed||f.k==='extra'||seen.has(f.k))continue;
    if(f.when&&!f.when(p))continue;
    seen.add(f.k);
    let v=p[f.k];
    if(v===undefined||v===null||v===''){if(f.req&&f.d!==undefined)v=f.d;else continue;}
    if(f.t==='bool')v=v?'true':'false';
    else if(f.t==='col'){v=normARGB(v);if(!v)continue;}
    else if(f.t==='img')v=resolveAssetPath('image',v,W&&{push:t=>W.push({t:t+' ('+label+')'})});
    else if(f.t==='aud')v=resolveAssetPath('audio',v,W&&{push:t=>W.push({t:t+' ('+label+')'})});
    else if(f.t==='fil')v=resolveAssetPath('other',v,W&&{push:t=>W.push({t:t+' ('+label+')'})});
    else if(f.t==='num'||f.t==='int'){if(!isNum(v))continue;v=fmtN(v);}
    else v=String(v).trim();
    if(v==='')continue;
    out+=' '+f.k+'="'+esc(v)+'"';
  }
  return out+extraAttrs(p.extra,W,label);
}
function tagL(n,name,attrs,kids){
  if(!kids||!kids.length)return[ind(n)+'<'+name+attrs+'/>'];
  return[ind(n)+'<'+name+attrs+'>',...kids,ind(n)+'</'+name+'>'];
}
function attrStr(o){let s='';for(const k in o)if(o[k]!==undefined&&o[k]!==''&&o[k]!==null)s+=' '+k+'="'+esc(o[k])+'"';return s;}

/* ---- Bindings ---- */
function bindingLine(b,n,W,where,el){
  const c=CATBY[b.pid];if(!c){W.push({t:'Unknown binding parameter at '+where,err:true});return null;}
  const a={type:c.type,level:c.level};
  let tgtOk=true;
  if(c.tk==='tag'){if(!b.tag){W.push({t:'Binding “'+c.label+'” at '+where+' has no tag name.',err:true});return null;}a.identifier=b.tag;}
  else if(c.tk!=='none'){
    if(b.tgt==='__tags'){if(!b.tag){W.push({t:'Binding “'+c.label+'” at '+where+' has no tag names.',err:true});return null;}a.identifier=b.tag;}
    else if(!b.tgt){W.push({t:'Binding “'+c.label+'” at '+where+' has no target ('+TK_LABEL[c.tk]+').',err:true});return null;}
    else if(c.tk==='group'){const i=S.groups.findIndex(g=>g.id===b.tgt);if(i<0)tgtOk=false;a.position=i;}
    else if(c.tk==='control'){const i=S.elements.findIndex(e=>e.id===b.tgt);if(i<0)tgtOk=false;a.position=i;a.controlIndex=i;}
    else if(c.tk==='modulator'){const i=S.modulators.findIndex(e=>e.id===b.tgt);if(i<0)tgtOk=false;a.position=i;a.modulatorIndex=i;}
    else if(c.tk==='bus'){const i=S.buses.findIndex(e=>e.id===b.tgt);if(i<0)tgtOk=false;a.position=i;a.busIndex=i;}
    else if(c.tk==='keycolor'){const i=S.keyboard.colors.findIndex(e=>e.id===b.tgt);if(i<0)tgtOk=false;a.position=i;a.colorIndex=i;}
    else if(c.tk==='effect'){
      const[k,x,y]=b.tgt.split(':');
      if(k==='i'){const i=S.effects.findIndex(e=>e.id===x);if(i<0)tgtOk=false;a.position=i;}
      else if(k==='g'){const gi=S.groups.findIndex(g=>g.id===x);const ei=gi<0?-1:S.groups[gi].fx.findIndex(e=>e.id===y);if(ei<0)tgtOk=false;a.level='group';a.groupIndex=gi;a.effectIndex=ei;a.position=ei;}
      else if(k==='b'){const bi=S.buses.findIndex(g=>g.id===x);const ei=bi<0?-1:S.buses[bi].fx.findIndex(e=>e.id===y);if(ei<0)tgtOk=false;a.level='bus';a.busIndex=bi;a.effectIndex=ei;a.position=ei;}
      else tgtOk=false;
    }
  }
  if(!tgtOk){W.push({t:'Binding “'+c.label+'” at '+where+': The selected target no longer exists.',err:true});return null;}
  a.parameter=c.p;
  const tr=b.translation||'linear';a.translation=tr;
  if(tr==='linear'){
    if(isNum(b.outMin))a.translationOutputMin=fmtN(b.outMin);if(isNum(b.outMax))a.translationOutputMax=fmtN(b.outMax);
    if(b.rev)a.translationReversed='true';
    if(el&&c.mm&&['control','labeled-knob'].includes(el.t)&&!isNum(b.outMin)&&!isNum(b.outMax)){
      const mn=isNum(el.p.minValue)?+el.p.minValue:0,mx=isNum(el.p.maxValue)?+el.p.maxValue:1;
      if(mn<c.mm[0]||mx>c.mm[1])W.push({t:'Knob “'+where+'”: value range '+mn+'…'+mx+' is outside the range of parameter “'+c.label+'“ ('+c.mm[0]+'…'+c.mm[1]+'). Set “Output Min/Max” in the binding or use “Fit knob range to parameter”.'});
    }
  }else if(tr==='table'){
    if(!/[,;]/.test(b.table||'')){W.push({t:'Binding at '+where+': Table is empty.',err:true});return null;}
    a.translationTable=b.table;
  }else{
    if(b.fix===''||b.fix===undefined){W.push({t:'Binding “'+c.label+'” at '+where+': “Fixed value” is missing.',err:true});return null;}
    a.translationValue=b.fix;
  }
  if(isNum(b.factor))a.factor=fmtN(b.factor);
  if(b.modBehavior)a.modBehavior=b.modBehavior;
  if(b.en===false)a.enabled='false';
  if(b.trig===false)a.triggerOnLoad='false';
  return ind(n)+'<binding'+attrStr(a)+'/>';
}
const bindLines=(arr,n,W,where,el)=>(arr||[]).map(b=>bindingLine(b,n,W,where,el)).filter(Boolean);

/* ---- UI-Elemente ---- */
function elLines(el,idx,n,W,LBL){
  const d=ELT[el.t],p=el.p,where=elName(el)+' (#'+idx+')';
  if(el.t==='label'&&LBL[el.id]){
    const b=elBox(el);
    return[ind(n)+'<image'+attrStr({x:b.x,y:b.y,width:b.w,height:b.h,path:LBL[el.id].path,tooltip:p.tooltip,visible:p.visible===false?'false':''})+'/>'];
  }
  const attrs=A(d.fields,p,W,where);
  let kids=[];
  if(d.knob)kids=bindLines(el.b,n+1,W,where,el);
  else if(el.t==='drawbars')kids=bindLines(el.b,n+1,W,where,el);
  else if(el.t==='button')(el.states||[]).forEach((s,i)=>kids.push(...tagL(n+1,'state',A(BTNSTATE_FIELDS,s.p,W,where+' State '+i),bindLines(s.b,n+2,W,where+' State '+i))));
  else if(el.t==='menu')(el.opts||[]).forEach((s,i)=>kids.push(...tagL(n+1,'option',A([F.txt('name','Text',{req:1})],s.p,W,where+' Entry '+(i+1)),bindLines(s.b,n+2,W,where+' Entry '+(i+1)))));
  else if(el.t==='xyPad'){const xb=bindLines(el.xb,n+2,W,where+' X',el),yb=bindLines(el.yb,n+2,W,where+' Y',el);if(xb.length)kids.push(...tagL(n+1,'x','',xb));if(yb.length)kids.push(...tagL(n+1,'y','',yb));}
  if((d.knob||el.t==='xyPad')&&!p.parameterName)W.push({t:where+': No “Parameter name” set – cannot be automated in the DAW.'});
  if(el.t==='button'&&!(el.states||[]).length)W.push({t:where+': Button without states.'});
  if((el.t==='image'||el.t==='multiFrameImage')&&!p.path)W.push({t:where+': No image file selected.',err:false});
  if(el.t==='menu'&&!(el.opts||[]).length)W.push({t:where+': Menu without entries.'});
  return tagL(n,d.tag,attrs,kids);
}

/* ---- Gesamt-XML ---- */
function buildXml(W,LBL){
  const L=['<?xml version="1.0" encoding="UTF-8"?>'];
  const mv=S.minVersion||'1.0.0';
  L.push('<DecentSampler minVersion="'+esc(mv)+'">');
  /* UI */
  const ui=S.ui;const uiAttrs=A(UI_FIELDS.filter(f=>f.k!=='tabName'),ui,W,'UI');
  const tabKids=[];
  S.elements.forEach((el,i)=>tabKids.push(...elLines(el,i,3,W,LBL)));
  const uiKids=tagL(2,'tab',attrStr({name:ui.tabName||'main'}),tabKids);
  if(S.keyboard.on){
    const kc=S.keyboard.colors.map(c=>ind(3)+'<color'+A(KEYCOLOR_FIELDS,c.p,W,'Key color')+'/>');
    uiKids.push(...tagL(2,'keyboard',attrStr({centerNote:isNum(S.keyboard.centerNote)?S.keyboard.centerNote:''}),kc));
  }
  L.push(...tagL(1,'ui',uiAttrs,uiKids));
  /* Gruppen */
  const gk=[];
  S.groups.forEach((g,i)=>{
    const w='Group '+i+' „'+(g.p.name||'')+'“';
    const kids=[];
    if(g.osc.on)kids.push(ind(3)+'<oscillator'+A([...OSC_FIELDS,...SYNTH_GROUP_FIELDS(g.osc.p)],g.osc.p,W,w+' Oscillator')+'/>');
    g.samples.forEach((s,j)=>{
      const a=ASSETS[s.p.path];
      if(!s.p.path)W.push({t:w+', sample '+(j+1)+': no file.',err:true});
      else if(!a)W.push({t:w+': File “'+s.p.path+'” is not in the file list – path will be entered anyway.'});
      else if(a.missing||!a.blob)W.push({t:w+': The audio file “'+s.p.path+'” is missing (not saved in the project) – please add it again under “Files”, otherwise it will be missing from the ZIP.'});
      kids.push(ind(3)+'<sample'+A(SAMPLE_FIELDS,s.p,W,w+', sample '+(j+1))+'/>');
    });
    if(g.fx.length)kids.push(...tagL(3,'effects','',g.fx.map(e=>ind(4)+'<effect type="'+e.type+'"'+A(EFFECTS[e.type].fields,e.p,W,w+' Effect')+'/>')));
    if(!g.osc.on&&!g.samples.length)W.push({t:w+' contains neither samples nor an oscillator – it will stay silent.'});
    gk.push(...tagL(2,'group',A(GROUP_FIELDS,g.p,W,w),kids));
  });
  L.push(...tagL(1,'groups',A(GROUPS_FIELDS,S.groupsP,W,'Instrument (global)'),gk));
  /* Effekte */
  if(S.effects.length)L.push(...tagL(1,'effects','',S.effects.map(e=>ind(2)+'<effect type="'+e.type+'"'+A(EFFECTS[e.type].fields,e.p,W,'Effect '+EFFECTS[e.type].name)+'/>')));
  /* Busse */
  if(S.buses.length)L.push(...tagL(1,'buses','',S.buses.flatMap((b,i)=>tagL(2,'bus',attrStr({busId:'BUS_'+(i+1)})+A(BUS_FIELDS,b.p,W,'Bus '+i),b.fx.length?tagL(3,'effects','',b.fx.map(e=>ind(4)+'<effect type="'+e.type+'"'+A(EFFECTS[e.type].fields,e.p,W,'Bus effect')+'/>')):[]))));
  /* Tags */
  if(S.tags.length)L.push(...tagL(1,'tags','',S.tags.map(t=>ind(2)+'<tag'+A(TAG_FIELDS,t.p,W,'Tag')+'/>')));
  /* Modulatoren */
  if(S.modulators.length)L.push(...tagL(1,'modulators','',S.modulators.flatMap((m,i)=>tagL(2,m.t,A(MODS[m.t].fields,m.p,W,'Modulator '+i),bindLines(m.b,3,W,'Modulator '+i+' ('+MODS[m.t].name+')')))));
  /* MIDI */
  const mk=[];
  S.midi.ccs.forEach(c=>mk.push(...tagL(2,'cc',A([F.int('number','',{req:1,d:1})],c.p,W,'CC'),bindLines(c.b,3,W,'CC '+c.p.number))));
  S.midi.notes.forEach(c=>mk.push(...tagL(2,'note',A(MIDINOTE_FIELDS,c.p,W,'MIDI note'),bindLines(c.b,3,W,'MIDI note '+c.p.note))));
  if(S.midi.velocity.on)mk.push(...tagL(2,'velocity','',bindLines(S.midi.velocity.b,3,W,'Velocity')));
  if(mk.length)L.push(...tagL(1,'midi','',mk));
  if(S.arp.on)L.push(ind(1)+'<arpeggiator enabled="true"'+A(ARP_FIELDS.slice(1),S.arp.p,W,'Arpeggiator')+'/>');
  /* Eigenes XML */
  if(S.customXml&&S.customXml.trim()){
    const err=xmlOk('<r>'+S.customXml+'</r>');
    if(err)W.push({t:'Custom XML (tab “MIDI & More”) is not well-formed and was omitted: '+err,err:true});
    else S.customXml.trim().split('\n').forEach(l=>L.push(ind(1)+l.trim()));
  }
  L.push('</DecentSampler>');
  return L.join('\n')+'\n';
}

/* ---- Label als Bild ---- */
async function renderLabelPNG(el,scale){
  scale=scale||2;const p=el.p,b=elBox(el);
  const vert=p.orientation==='vertical_up'||p.orientation==='vertical_down';
  const lw=vert?b.h:b.w,lh=vert?b.w:b.h;
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(b.w*scale));cv.height=Math.max(1,Math.round(b.h*scale));
  const c=cv.getContext('2d');c.scale(scale,scale);
  if(p.orientation==='vertical_up'){c.translate(0,b.h);c.rotate(-Math.PI/2);}
  else if(p.orientation==='vertical_down'){c.translate(b.w,0);c.rotate(Math.PI/2);}
  const size=+p.textSize||12;
  const font=(p.imgItalic?'italic ':'')+(p.imgBold?'bold ':'')+size+'px "'+p.imgFont+'", sans-serif';
  try{await document.fonts.load(font,p.text||'A');}catch(e){}
  c.font=font;c.textBaseline='top';c.fillStyle=cssColor(p.textColor,'FF000000');
  const lines=[];
  String(p.text||'').split('\n').forEach(par=>{
    let cur='';par.split(' ').forEach(w=>{const t=cur?cur+' '+w:w;if(cur&&c.measureText(t).width>lw){lines.push(cur);cur=w;}else cur=t;});lines.push(cur);
  });
  const lineH=size*1.15,total=lines.length*lineH;
  const y0=p.vAlign==='bottom'?lh-total:p.vAlign==='center'?(lh-total)/2:0;
  const ha=p.hAlign||'left';c.textAlign=ha;const x0=ha==='center'?lw/2:ha==='right'?lw:0;
  if(p.outlineWidth&&p.outlineColor){c.lineWidth=+p.outlineWidth*2;c.strokeStyle=cssColor(p.outlineColor);c.lineJoin='round';}
  lines.forEach((ln,i)=>{if(p.outlineWidth&&p.outlineColor)c.strokeText(ln,x0,y0+i*lineH);c.fillText(ln,x0,y0+i*lineH);});
  return await new Promise(r=>cv.toBlob(r,'image/png'));
}

/* ---- Alles zusammenbauen ---- */
async function buildAll(){
  const W=[],LBL={},files=[];
  let n=0;
  for(const el of S.elements){
    if(el.t==='label'&&el.p.imgFont&&el.p.text){
      n++;const name='label_'+n+'.png',path=joinPath(S.paths.images,name);
      LBL[el.id]={path};files.push({path,data:await renderLabelPNG(el)});
    }
  }
  const xml=buildXml(W,LBL);
  const nm=((S.name||'Instrument').replace(/[\\/:*?"<>|]/g,'_').trim()||'Instrument');
  const all=[{path:nm+'.dspreset',data:new Blob([xml],{type:'application/xml'})}];
  for(const a of Object.values(ASSETS)){
    if(a.kind==='font')continue;
    if(a.missing||!a.blob){if(a.kind!=='audio')W.push({t:'File “'+a.name+'” is missing.'});continue;}
    all.push({path:joinPath(folderFor(a.kind),a.name),data:a.blob});
  }
  all.push(...files);
  const usedA=new Set();S.groups.forEach(g=>g.samples.forEach(s=>usedA.add(s.p.path)));
  Object.values(ASSETS).filter(a=>a.kind==='audio'&&!usedA.has(a.name)).forEach(a=>W.push({t:'Audio file “'+a.name+'” is in the project but not assigned to any sample – it is NOT in the .dspreset. Add it to a group in tab 2.'}));
  const err=xmlOk(xml);if(err)W.push({t:'The generated XML is not well-formed: '+err,err:true});
  const seen=new Set();
  W.filter(w=>{const k=w.t;if(seen.has(k))return false;seen.add(k);return true;});
  const uniq=[];seen.clear();W.forEach(w=>{if(!seen.has(w.t)){seen.add(w.t);uniq.push(w);}});
  return{xml,files:all,warns:uniq};
}

/* ---- ZIP (ohne Kompression) ---- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
async function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const now=new Date();
  const dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF,dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  for(const f of files){
    const nameB=enc.encode(f.path);
    const u8=typeof f.data==='string'?enc.encode(f.data):(f.data instanceof Uint8Array?f.data:new Uint8Array(await f.data.arrayBuffer()));
    const crc=crc32(u8),size=u8.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,size,true);lh.setUint32(22,size,true);lh.setUint16(26,nameB.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nameB,u8);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,size,true);ch.setUint32(24,size,true);ch.setUint16(28,nameB.length,true);ch.setUint32(42,off,true);
    central.push(ch.buffer,nameB);
    off+=30+nameB.length+size;
  }
  let csize=0;central.forEach(c=>csize+=c.byteLength);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...central,end.buffer],{type:'application/zip'});
}
/* ===================== Start & Steuerung ===================== */
function renderAll(){
  $('#projName').value=S.name;
  renderDesign();
  if(VIEW!=='design')renderView(VIEW);
}
function setView(v){
  VIEW=v;
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v?'true':'false'));
  $$('main .view').forEach(s=>s.classList.toggle('active',s.id==='view-'+v));
  renderView(v);
}
function inField(e){const t=e.target;return t&&(t.tagName==='INPUT'&&!['checkbox','range','button'].includes(t.type)||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);}
function nudge(dx,dy){
  const el=S.elements.find(e=>e.id===SEL);if(!el)return;
  if(el.t==='line'){el.p.x1=(+el.p.x1||0)+dx;el.p.x2=(+el.p.x2||0)+dx;el.p.y1=(+el.p.y1||0)+dy;el.p.y2=(+el.p.y2||0)+dy;}
  else{el.p.x=(+el.p.x||0)+dx;el.p.y=(+el.p.y||0)+dy;}
  commit();renderCanvas();renderProps();
}
function newProjectFromDialog(kind){
  S=makeTemplate(kind);ASSETS={};SEL=null;SOUNDSEL=null;resetHistory();scheduleSave();renderAll();
}
async function dropFiles(files,x,y){
  files=[...files];if(!files.length)return;
  const as=await addAssetFiles(files);
  let made=0;
  if(VIEW==='design'&&x!==undefined)as.filter(a=>a.kind==='image').forEach(a=>{
    const el=newEl('image',Math.round(x+made*12),Math.round(y+made*12));
    const w=a.w||120,hh=a.h||120,k=Math.min(1,S.ui.width/w,S.ui.height/hh);
    el.p.path=a.name;el.p.width=Math.round(w*k);el.p.height=Math.round(hh*k);S.elements.push(el);SEL=el.id;made++;
  });
  const ad=adoptAudio(as);
  commit();rerender();
  if(!ad)toast(as.length+' file(s) added'+(made?' – image(s) inserted as element.':'.'));
}
function init(){
  initDesign();
  $$('#tabs button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
  $('#btnGoExport').addEventListener('click',()=>setView('export'));
  $('#btnUndo').addEventListener('click',undo);$('#btnRedo').addEventListener('click',redo);
  $('#projName').addEventListener('input',e=>{S.name=e.target.value;scheduleSave();});
  $('#projName').addEventListener('change',()=>{commit();});
  $('#btnSave').addEventListener('click',saveProject);
  $('#btnOpen').addEventListener('click',async()=>{
    const f=await pickFiles('.json,application/json',false);if(!f.length)return;
    try{await loadProject(JSON.parse(await f[0].text()));toast('Project opened.');}catch(e){toast('Opening failed: '+e.message,true);}
  });
  const dlg=$('#dlgNew');
  $('#btnNew').addEventListener('click',()=>dlg.showModal());
  $('#dlgNewCancel').addEventListener('click',()=>dlg.close());
  $('#dlgNewOk').addEventListener('click',()=>{dlg.close();newProjectFromDialog($('#tplSel').value);});
  document.addEventListener('keydown',e=>{
    const mod=e.ctrlKey||e.metaKey;
    if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject();return;}
    if(inField(e)||dlg.open)return;
    if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
    if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
    if(VIEW!=='design')return;
    if(mod&&e.key.toLowerCase()==='d'&&SEL&&SEL!=='ui'&&SEL!=='kbd'){e.preventDefault();dupEl(SEL);return;}
    if((e.key==='Delete')&&SEL&&SEL!=='ui'&&SEL!=='kbd'){e.preventDefault();delEl(SEL);return;}
    if(e.key.startsWith('Arrow')&&SEL&&SEL!=='ui'&&SEL!=='kbd'){
      const st=e.shiftKey?10:1;e.preventDefault();
      nudge(e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0);
    }
  });
  window.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault();});
  window.addEventListener('drop',e=>{
    if(!(e.dataTransfer&&e.dataTransfer.files.length))return;e.preventDefault();
    let x,y;if(e.target.closest&&e.target.closest('#stage')){[x,y]=canvasPoint(e);}
    dropFiles(e.dataTransfer.files,x,y);
  });
  /* Wiederherstellen */
  let loaded=false;
  try{const raw=localStorage.getItem('dsui_autosave');if(raw){loadProject(JSON.parse(raw)).then(()=>{toast('Last state restored.');}).catch(()=>{S=makeTemplate('basic');resetHistory();renderAll();});loaded=true;}}catch(e){}
  if(!loaded){S=makeTemplate('basic');resetHistory();renderAll();}
  window.__ds={get S(){return S;},ASSETS:()=>ASSETS,buildAll,makeZip,loadProject,makeTemplate,addElement,setView};
}
init();
</script>
